<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>가이드 리포트</title>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: #f2f2f7; }
    body {
      font-family: 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #fff;
      min-height: 100vh;
      color: #1c1c1e;
      line-height: 1.45;
      padding: 24px 16px 32px;
    }
    .app-shell {
      max-width: 540px;
      margin: 0 auto;
    }
    .screen {
      background: #f2f2f7;
      border-radius: 30px;
      padding: 20px 0 0;
      box-shadow: 0 20px 40px rgba(0,0,0,0.05);
    }
    .card {
      background: #fff;
      border-radius: 28px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.08);
      margin: 0 16px 16px;
      overflow: hidden;
    }
    .card-header {
      padding: 18px 18px 12px;
      border-bottom: 1px solid #e5e5ea;
    }
    .card-body {
      padding: 0 18px 18px;
    }
    h2 {
      font-size: 22px;
      font-weight: 700;
      color: #1c1c1e;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }
    h3 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: #6a6a70;
      margin-bottom: 14px;
    }
    .section-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.22em;
      color: #6a6a70;
      margin: 18px 0 8px;
    }
    .field { margin-bottom: 16px; }
    .field label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #3c3c43;
      margin-bottom: 6px;
    }
    .field input[type=text],
    .field input[type=email],
    .field input[type=password],
    .field textarea {
      width: 100%;
      padding: 14px 14px;
      border: 1px solid #d1d1d6;
      border-radius: 16px;
      font-size: 16px;
      font-family: inherit;
      background: #f7f7f7;
      color: #1c1c1e;
    }
    .field input[readonly] {
      background: #f2f2f7;
      color: #3c3c43;
    }
    .field textarea { resize: vertical; min-height: 88px; }
    input:focus, textarea:focus {
      outline: none;
      border-color: #8e8e93;
      box-shadow: 0 0 0 2px rgba(60,60,67,0.12);
    }
    .photo-btns { display: flex; gap: 10px; margin-bottom: 12px; }
    .photo-btns button {
      flex: 1;
      padding: 14px 12px;
      font-size: 14px;
      font-weight: 700;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      touch-action: manipulation;
      background: #1c1c1e;
      color: #fff;
      transition: opacity 0.2s ease;
    }
    .photo-btns button:active { opacity: .82; }
    input[type=file] { display: none; }
    .preview-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
    .preview-item {
      position: relative;
      width: 82px;
      height: 82px;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid #d1d1d6;
      background: #f7f7f7;
    }
    .preview-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .preview-item .rm {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(28,28,30,0.82);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      font-size: 13px;
      cursor: pointer;
      line-height: 24px;
      text-align: center;
      padding: 0;
    }
    .photo-count {
      font-size: 12px;
      color: #6a6a70;
      margin-top: 8px;
    }
    .progress-wrap { margin: 16px 0 0; display: none; }
    .progress-bar-bg {
      background: #e5e5ea;
      border-radius: 999px;
      height: 10px;
      overflow: hidden;
    }
    .progress-bar-fill {
      background: #1c1c1e;
      height: 100%;
      width: 0%;
      transition: width .3s ease;
      border-radius: 999px;
    }
    .progress-label {
      font-size: 12px;
      color: #6a6a70;
      margin-top: 8px;
    }
    #offline-banner {
      display: none;
      background: #f2f2f7;
      color: #3c3c43;
      border: 1px solid #d1d1d6;
      font-size: 13px;
      padding: 12px 14px;
      border-radius: 18px;
      margin: 0 16px 14px;
    }
    .btn-end,
    .btn-submit,
    .btn-login,
    .btn-new {
      width: 100%;
      padding: 16px 0;
      border: none;
      border-radius: 18px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
      background: #1c1c1e;
      color: #fff;
      transition: opacity .2s ease;
    }
    .btn-end { margin-bottom: 10px; }
    .btn-end:not(:disabled):active,
    .btn-submit:not(:disabled):active,
    .btn-login:not(:disabled):active,
    .btn-new:not(:disabled):active { opacity: .86; }
    button:disabled { opacity: .4; cursor: not-allowed; }
    #auth-screen { max-width: 540px; margin: 40px auto 0; }
    #auth-screen h2 { text-align: center; margin-bottom: 8px; font-size: 24px; }
    .auth-msg { font-size: 13px; color: #ff3b30; margin-top: 14px; text-align: center; }
    #success-screen {
      display: none;
      text-align: center;
      padding: 40px 20px;
      max-width: 540px;
      margin: 0 auto;
    }
    #success-screen .icon { font-size: 54px; margin-bottom: 16px; }
    #success-screen p {
      font-size: 18px;
      font-weight: 700;
      color: #1c1c1e;
      margin: 0 0 8px;
    }
    #success-screen small {
      font-size: 14px;
      color: #6a6a70;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 540px;
      margin: 0 auto 12px;
      padding: 0 18px;
    }
    .topbar span { font-size: 13px; color: #6a6a70; }
    .btn-logout {
      padding: 10px 14px;
      background: #f2f2f7;
      color: #1c1c1e;
      border: 1px solid #d1d1d6;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    /* Today View (guide app) */
    .today-card .meta-row { display:flex; gap:12px; align-items:center; margin-top:6px; }
    .today-card .stat { background:#f7f7f7; padding:8px 12px; border-radius:12px; text-align:center; }
    .today-card .stat-num { font-weight:700; font-size:16px; color:#1c1c1e; }
    .today-card .stat-label { font-size:11px; color:#6a6a70; margin-top:4px; }

    .grid-overview { margin: 10px 0 16px; }
    .grid-row { display:flex; gap:10px; }
    .grid-item { width:56px; height:56px; border-radius:10px; background:#fff; border:1px solid #d1d1d6; box-shadow: 0 1px 0 rgba(0,0,0,0.02); }

    .today-list { display:flex; flex-direction:column; gap:8px; }
    .list-item { display:flex; align-items:center; padding:12px; background: #fff; border-radius:12px; border:1px solid #e6e6ea; }
    .item-left { flex: 1; font-weight:700; color:#1c1c1e; }
    .item-middle { width:140px; color:#6a6a70; font-size:14px; }
    .item-right { width:120px; display:flex; gap:8px; justify-content:flex-end; }
    .item-right .box { width:44px; height:36px; background:#f7f7f7; border-radius:8px; border:1px solid #d1d1d6; }
  </style>
</head>
<body>
<div class="screen">

  <div class="app-shell">
    <div class="card today-card">
      <div class="card-header">
        <h2>Today</h2>
        <div class="meta-row">
          <div class="stat"><div class="stat-num">12</div><div class="stat-label">Week</div></div>
          <div class="stat"><div class="stat-num">5</div><div class="stat-label">Tours</div></div>
          <div class="stat"><div class="stat-num">2</div><div class="stat-label">Issues</div></div>
        </div>
      </div>
      <div class="card-body">
        <div class="grid-overview">
          <div class="grid-row">
            <div class="grid-item"></div>
            <div class="grid-item"></div>
            <div class="grid-item"></div>
            <div class="grid-item"></div>
          </div>
        </div>

        <div class="section-title">Today</div>
        <div class="today-list">
          <div class="list-item">
            <div class="item-left">홍길동</div>
            <div class="item-middle">TSIS · 08:00</div>
            <div class="item-right"><div class="box"></div><div class="box"></div></div>
          </div>
          <div class="list-item">
            <div class="item-left">차미도</div>
            <div class="item-middle">TSS · 09:30</div>
            <div class="item-right"><div class="box"></div><div class="box"></div></div>
          </div>
          <div class="list-item">
            <div class="item-left">공로동</div>
            <div class="item-middle">Resort · 10:00</div>
            <div class="item-right"><div class="box"></div><div class="box"></div></div>
          </div>
        </div>
      </div>
    </div>
  </div>

<!-- ① 로그인 화면 -->
<div id="auth-screen">
  <div class="card">
    <h2>📋 가이드 리포트 로그인</h2>
    <div class="field">
      <label>이메일</label>
      <input type="email" id="auth-email" placeholder="guide@example.com">
    </div>
    <div class="field">
      <label>비밀번호</label>
      <input type="password" id="auth-pw" placeholder="••••••••">
    </div>
    <button class="btn-login" onclick="Auth.login()">로그인</button>
    <p class="auth-msg" id="auth-msg"></p>
  </div>
</div>

<!-- ② 리포트 입력 화면 -->
<div id="report-screen" style="display:none;">
  <div class="topbar">
    <span id="user-label">가이드: —</span>
    <button class="btn-logout" onclick="Auth.logout()">로그아웃</button>
  </div>

  <div id="offline-banner">⚠️ 오프라인 — 입력값이 임시 저장됩니다. 연결 복구 후 제출하세요.</div>

  <div class="card">
    <h2>📋 투어 리포트</h2>

    <!-- 출발 시간 -->
    <div class="field">
      <label>예정 출발 시간</label>
      <input type="text" id="start-time" value="08:00" readonly>
    </div>

    <!-- 종료 시간 -->
    <div class="field">
      <label>실제 종료 시간</label>
      <input type="text" id="end-time" placeholder="종료 버튼을 누르세요" readonly>
    </div>

    <!-- 비고 -->
    <div class="field">
      <label>비고 (선택)</label>
      <textarea id="notes" placeholder="특이사항을 입력하세요"></textarea>
    </div>

    <!-- 영수증 사진 -->
    <div class="field">
      <label>영수증 사진 첨부 (최대 5장)</label>
      <input type="file" id="cam-input"  accept="image/*" capture="environment" onchange="Photos.add(this)">
      <input type="file" id="gal-input"  accept="image/*" multiple            onchange="Photos.add(this)">
      <div class="photo-btns">
        <button class="btn-cam" type="button" onclick="document.getElementById('cam-input').click()">📷 카메라</button>
        <button class="btn-gal" type="button" onclick="document.getElementById('gal-input').click()">🖼️ 갤러리</button>
      </div>
      <div class="preview-grid" id="preview-grid"></div>
      <p class="photo-count" id="photo-count"></p>
    </div>

    <!-- 진행률 -->
    <div class="progress-wrap" id="progress-wrap">
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
      <p class="progress-label" id="progress-label">업로드 중...</p>
    </div>

    <!-- 버튼 -->
    <button class="btn-end" id="end-btn" onclick="Report.captureEndTime()">
      🔴 투어 종료 (Turn off)
    </button>
    <button class="btn-submit" id="submit-btn" onclick="Report.submit()">
      최종 제출
    </button>
  </div>
</div>

<!-- ③ 제출 완료 화면 -->
<div id="success-screen">
  <div class="icon">✅</div>
  <p>리포트 제출 완료!</p>
  <small id="success-detail"></small>
  <br>
  <button class="btn-new" onclick="Report.reset()">새 리포트 작성</button>
</div>

<script>
// =====================================================
// ⚙️ 설정 — 본인 Supabase 값으로 교체하세요
// =====================================================
const SUPABASE_URL  = 'https://oybauzioqabopskxdaea.supabase.co';
const SUPABASE_KEY  = 'sb_publishable_XJxgPrF_34hg4ZhrS3qY3g_1xhq37ZB';
const STORAGE_BUCKET = 'receipts';
const OFFLINE_KEY    = 'tf_report_draft';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// =====================================================
// 🔐 Auth
// =====================================================
const Auth = {
  async login() {
    const email = document.getElementById('auth-email').value.trim();
    const pw    = document.getElementById('auth-pw').value;
    const msg   = document.getElementById('auth-msg');
    if (!email || !pw) { msg.innerText = '이메일과 비밀번호를 입력하세요.'; return; }

    const { data, error } = await sb.auth.signInWithPassword({ email, password: pw });
    if (error) { msg.innerText = error.message; return; }

    Auth.showReport(data.user);
  },

  async logout() {
    await sb.auth.signOut();
    document.getElementById('report-screen').style.display = 'none';
    document.getElementById('auth-screen').style.display   = 'block';
  },

  showReport(user) {
    document.getElementById('auth-screen').style.display   = 'none';
    document.getElementById('report-screen').style.display = 'block';
    document.getElementById('user-label').innerText =
      '가이드: ' + (user.email || user.id.slice(0, 8));
    Draft.load();
  },

  async init() {
    const { data: { user } } = await sb.auth.getUser();
    if (user) Auth.showReport(user);
  }
};

// =====================================================
// 📸 Photos
// =====================================================
const Photos = {
  _files: [],
  MAX: 5,

  add(input) {
    const newFiles = Array.from(input.files);
    const remaining = this.MAX - this._files.length;
    if (remaining <= 0) { alert('최대 5장까지 첨부 가능합니다.'); return; }
    newFiles.slice(0, remaining).forEach(f => this._files.push(f));
    input.value = '';
    this.render();
    Draft.save();
  },

  remove(idx) {
    this._files.splice(idx, 1);
    this.render();
    Draft.save();
  },

  render() {
    const grid  = document.getElementById('preview-grid');
    const count = document.getElementById('photo-count');
    grid.innerHTML = '';
    this._files.forEach((f, i) => {
      const url  = URL.createObjectURL(f);
      const item = document.createElement('div');
      item.className = 'preview-item';
      item.innerHTML =
        '<img src="' + url + '" alt="영수증">' +
        '<button class="rm" onclick="Photos.remove(' + i + ')">✕</button>';
      grid.appendChild(item);
    });
    count.innerText = this._files.length > 0
      ? this._files.length + '장 선택됨' : '';
  },

  getFiles() { return this._files; }
};

// =====================================================
// 💾 Draft (오프라인 임시저장)
// =====================================================
const Draft = {
  save() {
    localStorage.setItem(OFFLINE_KEY, JSON.stringify({
      endTime: document.getElementById('end-time').value,
      notes:   document.getElementById('notes').value,
      photoCount: Photos.getFiles().length
    }));
  },

  load() {
    try {
      const d = JSON.parse(localStorage.getItem(OFFLINE_KEY) || 'null');
      if (!d) return;
      if (d.endTime) {
        document.getElementById('end-time').value = d.endTime;
        const btn = document.getElementById('end-btn');
        btn.disabled = true;
        btn.innerText = '투어 종료 완료';
      }
      if (d.notes) document.getElementById('notes').value = d.notes;
    } catch (e) {}
  },

  clear() { localStorage.removeItem(OFFLINE_KEY); }
};

// =====================================================
// 📤 Report
// =====================================================
const Report = {
  captureEndTime() {
    const now = new Date();
    const t   = now.toLocaleTimeString('ko-KR', {
      hour: '2-digit', minute: '2-digit', hour12: false
    });
    document.getElementById('end-time').value = t;
    const btn = document.getElementById('end-btn');
    btn.disabled  = true;
    btn.innerText = '투어 종료 완료';
    Draft.save();
  },

  async submit() {
    const submitBtn = document.getElementById('submit-btn');
    const endTime   = document.getElementById('end-time').value;
    const notes     = document.getElementById('notes').value.trim();
    const files     = Photos.getFiles();

    // 검증
    if (!endTime) {
      alert('종료 시간을 먼저 기록해주세요.');
      return;
    }

    // 오프라인 차단
    if (!navigator.onLine) {
      alert('오프라인 상태입니다. 인터넷 연결 후 다시 시도하세요.');
      return;
    }

    submitBtn.disabled  = true;
    submitBtn.innerText = '제출 중...';

    // 진행률 바 표시
    const progressWrap  = document.getElementById('progress-wrap');
    const progressFill  = document.getElementById('progress-fill');
    const progressLabel = document.getElementById('progress-label');
    progressWrap.style.display = 'block';

    try {
      const { data: { user } } = await sb.auth.getUser();
      if (!user) throw new Error('로그인이 필요합니다.');

      // ── 1. 이미지 순차 업로드 ──────────────────────
      const receiptUrls = [];
      for (let i = 0; i < files.length; i++) {
        const pct   = Math.round(((i) / (files.length || 1)) * 80);
        progressFill.style.width  = pct + '%';
        progressLabel.innerText   = '이미지 업로드 중 (' + (i + 1) + '/' + files.length + ')...';

        const ext  = files[i].name.split('.').pop();
        const path = user.id + '/' + Date.now() + '_' + i + '.' + ext;

        const { error: upErr } = await sb.storage
          .from(STORAGE_BUCKET)
          .upload(path, files[i], { upsert: false });

        if (upErr) throw new Error('이미지 업로드 실패: ' + upErr.message);

        const { data: urlData } = sb.storage
          .from(STORAGE_BUCKET)
          .getPublicUrl(path);

        receiptUrls.push(urlData.publicUrl);
      }

      // ── 2. DB INSERT ────────────────────────────────
      progressFill.style.width  = '90%';
      progressLabel.innerText   = '데이터 저장 중...';

      const { error: dbErr } = await sb
        .from('reports')
        .insert({
          guide_id:        user.id,
          actual_end_time: endTime,
          receipt_urls:    receiptUrls,
          notes:           notes || null
        });

      if (dbErr) throw new Error('DB 저장 실패: ' + dbErr.message);

      // ── 3. 완료 ─────────────────────────────────────
      progressFill.style.width  = '100%';
      progressLabel.innerText   = '완료!';

      Draft.clear();

      const now = new Date();
      document.getElementById('success-detail').innerText =
        '종료 시간: ' + endTime +
        '  |  영수증 ' + receiptUrls.length + '장' +
        '  |  ' + now.toLocaleDateString('ko-KR');

      setTimeout(() => {
        document.getElementById('report-screen').style.display  = 'none';
        document.getElementById('success-screen').style.display = 'block';
      }, 600);

    } catch (err) {
      console.error('제출 실패:', err);
      alert('전송 실패: ' + err.message + '\n관리자에게 문의하세요.');
      submitBtn.disabled  = false;
      submitBtn.innerText = '최종 제출';
      progressWrap.style.display = 'none';
    }
  },

  reset() {
    document.getElementById('end-time').value = '';
    document.getElementById('notes').value    = '';
    document.getElementById('end-btn').disabled  = false;
    document.getElementById('end-btn').innerText = '🔴 투어 종료 (Turn off)';
    document.getElementById('submit-btn').disabled  = false;
    document.getElementById('submit-btn').innerText = '최종 제출';
    document.getElementById('progress-wrap').style.display = 'none';
    document.getElementById('preview-grid').innerHTML = '';
    document.getElementById('photo-count').innerText  = '';
    Photos._files = [];
    document.getElementById('success-screen').style.display = 'none';
    document.getElementById('report-screen').style.display  = 'block';
  }
};

// =====================================================
// 🌐 오프라인 감지
// =====================================================
window.addEventListener('offline', () => {
  document.getElementById('offline-banner').style.display = 'block';
  Draft.save();
});
window.addEventListener('online', () => {
  document.getElementById('offline-banner').style.display = 'none';
});

// =====================================================
// Today data binding (Supabase)
// =====================================================
const Today = {
  async init() {
    await this.load();
    setInterval(() => this.load(), 60_000);
  },

  async load() {
    const listEl = document.querySelector('.today-list');
    if (!listEl) return;
    listEl.innerHTML = '<div style="color:#6a6a70;padding:8px">불러오는 중...</div>';

    try {
      const today = new Date();
      const y = today.getFullYear();
      const m = String(today.getMonth() + 1).padStart(2, '0');
      const d = String(today.getDate()).padStart(2, '0');
      const todayStr = `${y}-${m}-${d}`; // expecting a YYYY-MM-DD field value

      // 1) fetch today's tours (adjust table/field names if your schema differs)
      let { data, error } = await sb
        .from('tours')
        .select('id, guest_name, start_time, tour_type, status')
        .eq('scheduled_date', todayStr)
        .order('start_time', { ascending: true });

      if (error) {
        console.warn('Today: primary query failed', error);
        data = [];
      }

      // render
      listEl.innerHTML = '';
      if (!data || data.length === 0) {
        listEl.innerHTML = '<div style="color:#6a6a70;padding:8px">오늘 일정이 없습니다.</div>';
      } else {
        data.forEach(item => {
          const li = document.createElement('div');
          li.className = 'list-item';

          const left = document.createElement('div'); left.className = 'item-left';
          left.innerText = item.guest_name || item.leader || '이름 없음';

          const mid = document.createElement('div'); mid.className = 'item-middle';
          mid.innerText = ((item.tour_type) ? item.tour_type + ' · ' : '') + (item.start_time || '시간 없음');

          const right = document.createElement('div'); right.className = 'item-right';
          const box1 = document.createElement('div'); box1.className = 'box';
          const box2 = document.createElement('div'); box2.className = 'box';
          right.appendChild(box1); right.appendChild(box2);

          li.appendChild(left); li.appendChild(mid); li.appendChild(right);
          listEl.appendChild(li);
        });
      }

      // update header stats: week total, tours today, issues count
      try {
        const weekStart = (() => {
          const d0 = new Date();
          const day = d0.getDay();
          const diff = d0.getDate() - day + (day === 0 ? -6 : 1); // Monday
          const m0 = new Date(d0.setDate(diff));
          return `${m0.getFullYear()}-${String(m0.getMonth()+1).padStart(2,'0')}-${String(m0.getDate()).padStart(2,'0')}`;
        })();
        const weekEnd = (() => {
          const s = new Date();
          const day = s.getDay();
          const diff = s.getDate() - day + (day === 0 ? 0 : 7);
          const e0 = new Date(s.setDate(diff));
          return `${e0.getFullYear()}-${String(e0.getMonth()+1).padStart(2,'0')}-${String(e0.getDate()).padStart(2,'0')}`;
        })();

        const weekRes = await sb
          .from('tours')
          .select('id', { count: 'exact', head: false })
          .gte('scheduled_date', weekStart)
          .lte('scheduled_date', weekEnd);

        const weekCount = (weekRes && weekRes.count) ? weekRes.count : '-';
        const toursCount = data ? data.length : 0;
        const issuesCount = data ? data.filter(i => i.status && /issue|problem|pending/i.test(i.status)).length : 0;

        const statNums = document.querySelectorAll('.today-card .stat-num');
        if (statNums && statNums.length >= 3) {
          statNums[0].innerText = weekCount;
          statNums[1].innerText = toursCount;
          statNums[2].innerText = issuesCount;
        }
      } catch (e) { console.warn('Today: failed to update stats', e); }

    } catch (err) {
      console.error('Today load failed', err);
      const listEl = document.querySelector('.today-list');
      if (listEl) listEl.innerHTML = '<div style="color:#6a6a70;padding:8px">데이터 로드 실패</div>';
    }
  }
};

// =====================================================
// 🚀 초기화
// =====================================================
Today.init();
Auth.init();
</script>
