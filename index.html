<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>가이드 리포트</title>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f4f8; min-height: 100vh; padding: 16px;
    }
    .card {
      background: #fff; border-radius: 14px; padding: 20px;
      box-shadow: 0 2px 10px rgba(0,0,0,.09); max-width: 480px;
      margin: 0 auto; margin-bottom: 14px;
    }
    h2 { font-size: 1.1em; margin-bottom: 14px; color: #1e293b; }
    h3 { font-size: .85em; text-transform: uppercase; letter-spacing: .8px;
         color: #64748b; margin-bottom: 12px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 12px; font-weight: 600;
                   color: #475569; margin-bottom: 4px; }
    .field input[type=text],
    .field input[type=email],
    .field textarea {
      width: 100%; padding: 11px 12px; border: 1px solid #ddd;
      border-radius: 8px; font-size: 15px; font-family: inherit;
      background: #fff;
    }
    .field input[readonly] { background: #f8fafc; color: #334155; }
    .field textarea { resize: vertical; min-height: 72px; }
    input:focus, textarea:focus {
      outline: none; border-color: #1e40af;
      box-shadow: 0 0 0 2px rgba(30,64,175,.13);
    }

    /* 사진 업로드 */
    .photo-btns { display: flex; gap: 8px; margin-bottom: 10px; }
    .photo-btns button { flex: 1; padding: 10px 6px; font-size: 13px;
                         font-weight: 700; border: none; border-radius: 8px;
                         cursor: pointer; touch-action: manipulation; }
    .btn-cam  { background: #0f766e; color: #fff; }
    .btn-gal  { background: #6d28d9; color: #fff; }
    .btn-cam:active, .btn-gal:active { opacity: .8; }
    input[type=file] { display: none; }

    .preview-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
    .preview-item {
      position: relative; width: 80px; height: 80px;
      border-radius: 7px; overflow: hidden;
      border: 1px solid #e2e8f0;
    }
    .preview-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .preview-item .rm {
      position: absolute; top: 2px; right: 2px;
      background: rgba(0,0,0,.6); color: #fff;
      border: none; border-radius: 50%; width: 20px; height: 20px;
      font-size: 11px; cursor: pointer; line-height: 20px; text-align: center;
      padding: 0;
    }
    .photo-count { font-size: 11px; color: #64748b; margin-top: 4px; }

    /* 진행률 */
    .progress-wrap { margin: 10px 0; display: none; }
    .progress-bar-bg {
      background: #e2e8f0; border-radius: 999px; height: 8px; overflow: hidden;
    }
    .progress-bar-fill {
      background: #1e40af; height: 100%; width: 0%;
      transition: width .3s; border-radius: 999px;
    }
    .progress-label { font-size: 12px; color: #475569; margin-top: 4px; }

    /* 오프라인 배너 */
    #offline-banner {
      display: none; background: #fef3c7; border: 1px solid #fde68a;
      color: #92400e; font-size: 12px; font-weight: 600;
      padding: 8px 12px; border-radius: 8px; margin-bottom: 12px;
    }

    /* 액션 버튼 */
    .btn-end {
      width: 100%; padding: 13px; background: #ff6b35; color: #fff;
      border: none; border-radius: 8px; font-size: 15px; font-weight: 700;
      cursor: pointer; touch-action: manipulation; margin-bottom: 10px;
    }
    .btn-submit {
      width: 100%; padding: 13px; background: #1e40af; color: #fff;
      border: none; border-radius: 8px; font-size: 15px; font-weight: 700;
      cursor: pointer; touch-action: manipulation;
    }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .btn-end:not(:disabled):active,
    .btn-submit:not(:disabled):active { opacity: .85; }

    /* 인증 화면 */
    #auth-screen { max-width: 480px; margin: 40px auto; }
    #auth-screen h2 { text-align: center; margin-bottom: 20px; font-size: 1.2em; }
    .btn-login {
      width: 100%; padding: 13px; background: #1e40af; color: #fff;
      border: none; border-radius: 8px; font-size: 15px; font-weight: 700;
      cursor: pointer; margin-top: 10px;
    }
    .auth-msg { font-size: 13px; color: #dc2626; margin-top: 8px; text-align: center; }

    /* 완료 화면 */
    #success-screen {
      display: none; text-align: center; padding: 40px 20px;
      max-width: 480px; margin: 0 auto;
    }
    #success-screen .icon { font-size: 56px; }
    #success-screen p { font-size: 16px; font-weight: 700; color: #16a34a;
                        margin: 12px 0 6px; }
    #success-screen small { font-size: 13px; color: #64748b; }
    .btn-new {
      margin-top: 20px; padding: 11px 24px; background: #1e40af; color: #fff;
      border: none; border-radius: 8px; font-size: 14px; font-weight: 700;
      cursor: pointer;
    }

    /* 로그아웃 */
    .topbar { display: flex; justify-content: space-between; align-items: center;
              max-width: 480px; margin: 0 auto 10px; }
    .topbar span { font-size: 13px; color: #64748b; }
    .btn-logout { padding: 5px 12px; background: #f1f5f9; color: #475569;
                  border: none; border-radius: 6px; font-size: 12px;
                  font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>

<!-- ① 로그인 화면 -->
<div id="auth-screen">
  <div class="card">
    <h2>📋 가이드 리포트 로그인</h2>
    <div class="field">
      <label>이메일</label>
      <input type="email" id="auth-email" placeholder="guide@example.com">
    </div>
    <div class="field">
      <label>비밀번호</label>
      <input type="password" id="auth-pw" placeholder="••••••••">
    </div>
    <button class="btn-login" onclick="Auth.login()">로그인</button>
    <p class="auth-msg" id="auth-msg"></p>
  </div>
</div>

<!-- ② 리포트 입력 화면 -->
<div id="report-screen" style="display:none;">
  <div class="topbar">
    <span id="user-label">가이드: —</span>
    <button class="btn-logout" onclick="Auth.logout()">로그아웃</button>
  </div>

  <div id="offline-banner">⚠️ 오프라인 — 입력값이 임시 저장됩니다. 연결 복구 후 제출하세요.</div>

  <div class="card">
    <h2>📋 투어 리포트</h2>

    <!-- 출발 시간 -->
    <div class="field">
      <label>예정 출발 시간</label>
      <input type="text" id="start-time" value="08:00" readonly>
    </div>

    <!-- 종료 시간 -->
    <div class="field">
      <label>실제 종료 시간</label>
      <input type="text" id="end-time" placeholder="종료 버튼을 누르세요" readonly>
    </div>

    <!-- 비고 -->
    <div class="field">
      <label>비고 (선택)</label>
      <textarea id="notes" placeholder="특이사항을 입력하세요"></textarea>
    </div>

    <!-- 영수증 사진 -->
    <div class="field">
      <label>영수증 사진 첨부 (최대 5장)</label>
      <input type="file" id="cam-input"  accept="image/*" capture="environment" onchange="Photos.add(this)">
      <input type="file" id="gal-input"  accept="image/*" multiple            onchange="Photos.add(this)">
      <div class="photo-btns">
        <button class="btn-cam" type="button" onclick="document.getElementById('cam-input').click()">📷 카메라</button>
        <button class="btn-gal" type="button" onclick="document.getElementById('gal-input').click()">🖼️ 갤러리</button>
      </div>
      <div class="preview-grid" id="preview-grid"></div>
      <p class="photo-count" id="photo-count"></p>
    </div>

    <!-- 진행률 -->
    <div class="progress-wrap" id="progress-wrap">
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
      <p class="progress-label" id="progress-label">업로드 중...</p>
    </div>

    <!-- 버튼 -->
    <button class="btn-end" id="end-btn" onclick="Report.captureEndTime()">
      🔴 투어 종료 (Turn off)
    </button>
    <button class="btn-submit" id="submit-btn" onclick="Report.submit()">
      최종 제출
    </button>
  </div>
</div>

<!-- ③ 제출 완료 화면 -->
<div id="success-screen">
  <div class="icon">✅</div>
  <p>리포트 제출 완료!</p>
  <small id="success-detail"></small>
  <br>
  <button class="btn-new" onclick="Report.reset()">새 리포트 작성</button>
</div>

<script>
// =====================================================
// ⚙️ 설정 — 본인 Supabase 값으로 교체하세요
// =====================================================
const SUPABASE_URL  = 'https://oybauzioqabopskxdaea.supabase.co';
const SUPABASE_KEY  = 'sb_publishable_XJxgPrF_34hg4ZhrS3qY3g_1xhq37ZB';
const STORAGE_BUCKET = 'receipts';
const OFFLINE_KEY    = 'tf_report_draft';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// =====================================================
// 🔐 Auth
// =====================================================
const Auth = {
  async login() {
    const email = document.getElementById('auth-email').value.trim();
    const pw    = document.getElementById('auth-pw').value;
    const msg   = document.getElementById('auth-msg');
    if (!email || !pw) { msg.innerText = '이메일과 비밀번호를 입력하세요.'; return; }

    const { data, error } = await sb.auth.signInWithPassword({ email, password: pw });
    if (error) { msg.innerText = error.message; return; }

    Auth.showReport(data.user);
  },

  async logout() {
    await sb.auth.signOut();
    document.getElementById('report-screen').style.display = 'none';
    document.getElementById('auth-screen').style.display   = 'block';
  },

  showReport(user) {
    document.getElementById('auth-screen').style.display   = 'none';
    document.getElementById('report-screen').style.display = 'block';
    document.getElementById('user-label').innerText =
      '가이드: ' + (user.email || user.id.slice(0, 8));
    Draft.load();
  },

  async init() {
    const { data: { user } } = await sb.auth.getUser();
    if (user) Auth.showReport(user);
  }
};

// =====================================================
// 📸 Photos
// =====================================================
const Photos = {
  _files: [],
  MAX: 5,

  add(input) {
    const newFiles = Array.from(input.files);
    const remaining = this.MAX - this._files.length;
    if (remaining <= 0) { alert('최대 5장까지 첨부 가능합니다.'); return; }
    newFiles.slice(0, remaining).forEach(f => this._files.push(f));
    input.value = '';
    this.render();
    Draft.save();
  },

  remove(idx) {
    this._files.splice(idx, 1);
    this.render();
    Draft.save();
  },

  render() {
    const grid  = document.getElementById('preview-grid');
    const count = document.getElementById('photo-count');
    grid.innerHTML = '';
    this._files.forEach((f, i) => {
      const url  = URL.createObjectURL(f);
      const item = document.createElement('div');
      item.className = 'preview-item';
      item.innerHTML =
        '<img src="' + url + '" alt="영수증">' +
        '<button class="rm" onclick="Photos.remove(' + i + ')">✕</button>';
      grid.appendChild(item);
    });
    count.innerText = this._files.length > 0
      ? this._files.length + '장 선택됨' : '';
  },

  getFiles() { return this._files; }
};

// =====================================================
// 💾 Draft (오프라인 임시저장)
// =====================================================
const Draft = {
  save() {
    localStorage.setItem(OFFLINE_KEY, JSON.stringify({
      endTime: document.getElementById('end-time').value,
      notes:   document.getElementById('notes').value,
      photoCount: Photos.getFiles().length
    }));
  },

  load() {
    try {
      const d = JSON.parse(localStorage.getItem(OFFLINE_KEY) || 'null');
      if (!d) return;
      if (d.endTime) {
        document.getElementById('end-time').value = d.endTime;
        const btn = document.getElementById('end-btn');
        btn.disabled = true;
        btn.innerText = '투어 종료 완료';
      }
      if (d.notes) document.getElementById('notes').value = d.notes;
    } catch (e) {}
  },

  clear() { localStorage.removeItem(OFFLINE_KEY); }
};

// =====================================================
// 📤 Report
// =====================================================
const Report = {
  captureEndTime() {
    const now = new Date();
    const t   = now.toLocaleTimeString('ko-KR', {
      hour: '2-digit', minute: '2-digit', hour12: false
    });
    document.getElementById('end-time').value = t;
    const btn = document.getElementById('end-btn');
    btn.disabled  = true;
    btn.innerText = '투어 종료 완료';
    Draft.save();
  },

  async submit() {
    const submitBtn = document.getElementById('submit-btn');
    const endTime   = document.getElementById('end-time').value;
    const notes     = document.getElementById('notes').value.trim();
    const files     = Photos.getFiles();

    // 검증
    if (!endTime) {
      alert('종료 시간을 먼저 기록해주세요.');
      return;
    }

    // 오프라인 차단
    if (!navigator.onLine) {
      alert('오프라인 상태입니다. 인터넷 연결 후 다시 시도하세요.');
      return;
    }

    submitBtn.disabled  = true;
    submitBtn.innerText = '제출 중...';

    // 진행률 바 표시
    const progressWrap  = document.getElementById('progress-wrap');
    const progressFill  = document.getElementById('progress-fill');
    const progressLabel = document.getElementById('progress-label');
    progressWrap.style.display = 'block';

    try {
      const { data: { user } } = await sb.auth.getUser();
      if (!user) throw new Error('로그인이 필요합니다.');

      // ── 1. 이미지 순차 업로드 ──────────────────────
      const receiptUrls = [];
      for (let i = 0; i < files.length; i++) {
        const pct   = Math.round(((i) / (files.length || 1)) * 80);
        progressFill.style.width  = pct + '%';
        progressLabel.innerText   = '이미지 업로드 중 (' + (i + 1) + '/' + files.length + ')...';

        const ext  = files[i].name.split('.').pop();
        const path = user.id + '/' + Date.now() + '_' + i + '.' + ext;

        const { error: upErr } = await sb.storage
          .from(STORAGE_BUCKET)
          .upload(path, files[i], { upsert: false });

        if (upErr) throw new Error('이미지 업로드 실패: ' + upErr.message);

        const { data: urlData } = sb.storage
          .from(STORAGE_BUCKET)
          .getPublicUrl(path);

        receiptUrls.push(urlData.publicUrl);
      }

      // ── 2. DB INSERT ────────────────────────────────
      progressFill.style.width  = '90%';
      progressLabel.innerText   = '데이터 저장 중...';

      const { error: dbErr } = await sb
        .from('reports')
        .insert({
          guide_id:        user.id,
          actual_end_time: endTime,
          receipt_urls:    receiptUrls,
          notes:           notes || null
        });

      if (dbErr) throw new Error('DB 저장 실패: ' + dbErr.message);

      // ── 3. 완료 ─────────────────────────────────────
      progressFill.style.width  = '100%';
      progressLabel.innerText   = '완료!';

      Draft.clear();

      const now = new Date();
      document.getElementById('success-detail').innerText =
        '종료 시간: ' + endTime +
        '  |  영수증 ' + receiptUrls.length + '장' +
        '  |  ' + now.toLocaleDateString('ko-KR');

      setTimeout(() => {
        document.getElementById('report-screen').style.display  = 'none';
        document.getElementById('success-screen').style.display = 'block';
      }, 600);

    } catch (err) {
      console.error('제출 실패:', err);
      alert('전송 실패: ' + err.message + '\n관리자에게 문의하세요.');
      submitBtn.disabled  = false;
      submitBtn.innerText = '최종 제출';
      progressWrap.style.display = 'none';
    }
  },

  reset() {
    document.getElementById('end-time').value = '';
    document.getElementById('notes').value    = '';
    document.getElementById('end-btn').disabled  = false;
    document.getElementById('end-btn').innerText = '🔴 투어 종료 (Turn off)';
    document.getElementById('submit-btn').disabled  = false;
    document.getElementById('submit-btn').innerText = '최종 제출';
    document.getElementById('progress-wrap').style.display = 'none';
    document.getElementById('preview-grid').innerHTML = '';
    document.getElementById('photo-count').innerText  = '';
    Photos._files = [];
    document.getElementById('success-screen').style.display = 'none';
    document.getElementById('report-screen').style.display  = 'block';
  }
};

// =====================================================
// 🌐 오프라인 감지
// =====================================================
window.addEventListener('offline', () => {
  document.getElementById('offline-banner').style.display = 'block';
  Draft.save();
});
window.addEventListener('online', () => {
  document.getElementById('offline-banner').style.display = 'none';
});

// =====================================================
// 🚀 초기화
// =====================================================
Auth.init();
</script>

</body>
</html>
