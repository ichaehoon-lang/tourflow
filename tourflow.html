<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tour Quote App</title>
<style>
* { box-sizing: border-box; }
html { background: #f2f2f7; }
body {
    font-family: 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    padding: 20px;
    padding-bottom: 110px;
    margin: 0;
    background: #fff;
    color: #1c1c1e;
    -webkit-tap-highlight-color: transparent;
}
h2 { margin-top: 0; font-size: 20px; font-weight:700; color:#1c1c1e; }
.sticky-buttons {
    position: fixed;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 48px);
    max-width: 900px;
    background-color: transparent;
    padding: 6px;
    display: flex;
    gap: 10px;
    z-index: 1000;
}
.sticky-buttons button { flex: 1; border-radius: 14px; background:#1c1c1e; color:#fff; }
input[type="text"], input[type="number"], input[type="date"], textarea {
    margin: 8px 0;
    padding: 12px 14px;
    width: 100%;
    border: 1px solid #d1d1d6;
    border-radius: 12px;
    font-size: 15px;
    background: #f7f7f7;
    -webkit-appearance: none;
    font-family: inherit;
}
textarea { resize: vertical; min-height: 90px; }
input:focus, textarea:focus { outline: none; border-color: #8e8e93; box-shadow: 0 0 0 4px rgba(60,60,67,0.06); }
input[type="checkbox"] { margin: 6px 8px 6px 0; width: 18px; height: 18px; cursor: pointer; }
button { padding: 12px 14px; cursor: pointer; min-height: 46px; background-color: #1c1c1e; color: white; border: none; border-radius: 12px; font-size: 15px; font-weight:700; }
button:active { opacity: 0.88; transform: none; }
button:disabled { background-color: #d1d1d6; color:#8e8e93; cursor:not-allowed; }
button.btn-secondary { background:#f2f2f7; color:#1c1c1e; border:1px solid #d1d1d6; }
.form-section { background: #fff; padding: 0; border-radius: 16px; margin-bottom: 16px; box-shadow: 0 6px 18px rgba(0,0,0,0.04); overflow:hidden; }
details { background: transparent; margin-bottom: 12px; border-radius: 12px; overflow: hidden; }
#quote_list { margin-top: 16px; padding-bottom: 20px; }
details summary { padding: 14px 16px; cursor: pointer; font-weight: 700; color:#1c1c1e; background:#fff; border-bottom:1px solid #e9e9ec; }
details summary:hover { background:#fafafa; }
details[open] summary { border-bottom:1px solid #e0e0e0; }
details > div { padding: 12px 16px 18px; background:#fff; }
.checkbox-row { display:flex; align-items:center; margin:12px 0; }
.checkbox-row label { display:flex; align-items:center; cursor:pointer; font-size:15px; }
.box { border:1px solid #e9e9ec; padding:12px; margin:12px 0; border-radius:12px; background:#fff; }
.box h4 { margin:0 0 8px 0; color:#1c1c1e; font-size:16px; }
.box p { margin:4px 0; font-size:14px; color:#6a6a70; }
.box .quote-actions { margin-top:10px; display:flex; gap:8px; }
.good { color:#1c1c1e; font-weight:700; }
.risk { color:#6a6a70; font-weight:700; }
.bad { color:#6a6a70; font-weight:700; }
.editing-highlight { box-shadow:0 6px 18px rgba(0,0,0,0.06); border-radius:12px; }
.editing-banner { background:#1c1c1e; color:#fff; padding:10px 12px; border-radius:10px; margin-bottom:12px; display:none; align-items:center; justify-content:space-between; }
.editing-banner.show { display:flex; }
#loading-indicator { text-align:center; padding:20px; font-size:1em; color:#6a6a70; display:none; }
#message { padding:8px 0; font-size:0.95em; min-height:20px; color:#6a6a70; }
.msg-success { color:#1c1c1e; }
.msg-error { color:#6a6a70; }
.msg-info { color:#6a6a70; }
#result { background:#fff; padding:12px; border-radius:12px; margin:12px 0; font-size:0.95em; line-height:1.6; display:none; }
#result.show { display:block; }
@media (min-width: 768px) {
    body { padding: 30px; padding-bottom: 110px; max-width: 980px; margin: 0 auto; }
    input[type="text"], input[type="number"], input[type="date"], textarea { width: 48%; display:inline-block; margin-right:2%; }
    .sticky-buttons { width: calc(100% - 200px); left:50%; transform:translateX(-50%); }
}
</style>
</head>
<body>

<h2>Tour Quote Management</h2>

<div class="editing-banner" id="editing-banner">
    <span id="editing-label">Editing: —</span>
    <button onclick="clearForm()" style="flex:0; min-width:60px; padding:6px 12px; min-height:32px; font-size:13px;">Cancel</button>

<div class="form-section" id="form-section">

        <summary>Quote Information</summary>

            <input id="company_abn" type="text" placeholder="Company ABN">

            <input id="company_phone" type="text" placeholder="Company Phone">
            <input id="company_email" type="text" placeholder="Company Email">
        </div>
    </details>

    <!-- Client / Agency Information -->
    <details>
        <summary>Client / Agency Information</summary>
        <div>
            <input id="agency" type="text" placeholder="Agency">
            <input id="contact_person" type="text" placeholder="Contact Person">
            <input id="client_email" type="text" placeholder="Client Email">
            <input id="client_phone" type="text" placeholder="Client Phone">
        </div>
    </details>

    <!-- Event Information -->
    <details open>
        <summary>Event Information</summary>
        <div>
            <input id="tour_name" type="text" placeholder="Tour Name">
            <input id="start_date" type="date">
            <input id="end_date" type="date">
            
            <input id="vehicle_type" type="text" placeholder="Vehicle Type">
            <input id="pax" type="number" placeholder="Total Pax" inputmode="numeric">
            <input id="pax_adult" type="number" placeholder="Adult Pax" inputmode="numeric">
            <input id="pax_child" type="number" placeholder="Child Pax" inputmode="numeric">
            <input id="pax_tc" type="number" placeholder="Teacher/Chaperone Pax" inputmode="numeric">
            
        </div>
    </details>

    <!-- Hotel -->
    <details open>
        <summary>Hotel</summary>
        <div>
            <div id="hotel_rows"></div>
            <p id="hotel_subtotal" style="font-weight:600; margin-top:8px; color:#333;">Subtotal: $0.00</p>
            <button type="button" onclick="addHotelRow()" class="btn-secondary">+ Add Hotel</button>
        </div>
    </details>

    <!-- Cost Breakdown -->
    <details open>
        <summary>Cost Breakdown</summary>
        <div>
            <input id="hotel_cost" type="number" placeholder="Hotel Cost" inputmode="decimal">
            <input id="transport_cost" type="number" placeholder="Transport Cost" inputmode="decimal">
            <input id="meal_cost" type="number" placeholder="Meal Cost" inputmode="decimal">
            <input id="attraction_cost" type="number" placeholder="Attraction Cost" inputmode="decimal">
            <input id="guide_cost" type="number" placeholder="Guide Cost" inputmode="decimal">
            <input id="other_cost" type="number" placeholder="Other Cost" inputmode="decimal">
        </div>
    </details>

    <!-- Revenue / Income -->
    <details open>
        <summary>Revenue / Income</summary>
        <div>
            <input id="tour_fee" type="number" placeholder="Tour Fee" inputmode="decimal">
            <input id="shopping_count" type="number" placeholder="Shopping Count" inputmode="numeric">
            <input id="health_sales" type="number" placeholder="Health Sales" inputmode="decimal">
            <input id="general_sales" type="number" placeholder="General Goods Sales" inputmode="decimal">
            <input id="wool_sales" type="number" placeholder="Wool Sales" inputmode="decimal">
        </div>
    </details>

    <!-- Commercial Terms -->
    <details>
        <summary>Commercial Terms</summary>
        <div>
            <div class="checkbox-row">
                <label>
                    <input id="gst_included" type="checkbox" onchange="calculate()">

            </div>
            <input id="payment_terms" type="text" placeholder="Payment Terms">
            <input id="cancellation_policy" type="text" placeholder="Cancellation Policy">
            <input id="valid_until" type="date">

    </details>

<script>
var SUPABASE_URL = "https://oybauzioqabopskxdaea.supabase.co";
var SUPABASE_KEY = "sb_publishable_XJxgPrF_34hg4ZhrS3qY3g_1xhq37ZB";

var editingId = null;

var total_shopping_sales = 0;
var total_operating_income = 0;
var gst_amount = 0;
var total_incl_gst = 0;
var profit_loss = 0;
var profit_rate = 0;
var status = "";

var quotesCache = [];

function val(id) {
    var v = document.getElementById(id).value;
    return v === "" ? null : Number(v);
}

function num(id) {
    var v = val(id);
    return v === null ? 0 : v;
}

function showMsg(text, type) {
    var el = document.getElementById("message");
    el.innerText = text;
    el.className = type === "error" ? "msg-error" : type === "success" ? "msg-success" : "msg-info";
}

function getTodayDate() {
    var today = new Date();
    var year = today.getFullYear();
    var month = String(today.getMonth() + 1).padStart(2, '0');
    var day = String(today.getDate()).padStart(2, '0');
    return year + '-' + month + '-' + day;
}

function getDatePlus30Days() {
    var today = new Date();
    today.setDate(today.getDate() + 30);
    var year = today.getFullYear();
    var month = String(today.getMonth() + 1).padStart(2, '0');
    var day = String(today.getDate()).padStart(2, '0');
    return year + '-' + month + '-' + day;
}

function getStatusEnglish(pl) {
    if (pl > 0) return "Profit";
    else if (pl === 0) return "Break-even";
    else return "Loss";
}

function calculate() {
    total_cost =
        num("hotel_cost") +
        num("transport_cost") +
        num("meal_cost") +
        num("attraction_cost") +
        num("guide_cost") +
        num("other_cost");

    total_shopping_sales =
        num("health_sales") +
        num("general_sales") +
        num("wool_sales");

    total_operating_income = num("tour_fee") + total_shopping_sales;

    var gst_checked = document.getElementById("gst_included").checked;
    gst_amount = gst_checked ? Math.round(total_operating_income * 0.1 * 100) / 100 : 0;
    total_incl_gst = total_operating_income + gst_amount;

    profit_loss = total_operating_income - total_cost;
    profit_rate = total_operating_income > 0 ? (profit_loss / total_operating_income) * 100 : 0;

    status = getStatusEnglish(profit_loss);

    var cls = status === "Profit" ? "good" : status === "Break-even" ? "risk" : "bad";

    var resultEl = document.getElementById("result");
    var gstLine = gst_checked ? '<br>GST (10%): <b>$' + gst_amount.toLocaleString() + '</b><br>Total (incl. GST): <b>$' + total_incl_gst.toLocaleString() + '</b>' : '';
    resultEl.innerHTML =
        "Total Cost: <b>$" + total_cost.toLocaleString() + "</b><br>" +
        "Total Operating Income: <b>$" + total_operating_income.toLocaleString() + "</b>" + gstLine + "<br>" +
        "Profit / Loss: <b class='" + cls + "'>$" + profit_loss.toLocaleString() + "</b><br>" +
        "Profit Rate: " + profit_rate.toFixed(2) + "%<br>" +
        "Status: <span class='" + cls + "'>" + status + "</span>";
    resultEl.classList.add("show");
}

    };
}

async function saveQuote() {
    if (isSaving) return;
    isSaving = true;
    var btn = document.getElementById("btn-save");
    btn.disabled = true;
    btn.innerText = "Saving...";

    var data = dbPayload();
    showMsg("Saving...", "info");

    var url = editingId
        ? SUPABASE_URL + "/rest/v1/quotes?id=eq." + editingId
        : SUPABASE_URL + "/rest/v1/quotes";

    var method = editingId ? "PATCH" : "POST";

    try {
        var res = await fetch(url, {
            method: method,
            headers: {
                "Content-Type": "application/json",
                "apikey": SUPABASE_KEY,
                "Authorization": "Bearer " + SUPABASE_KEY,
                "Prefer": "return=representation"
            },
            body: JSON.stringify(data)
        });

        var text = await res.text();

        if (!res.ok) {
            showMsg("Save failed: " + res.status, "error");
            console.error("Save error:", res.status, text);
        } else {
            showMsg(editingId ? "Updated successfully" : "Saved successfully", "success");
            editingId = null;
            document.getElementById("form-section").classList.remove("editing-highlight");
            document.getElementById("editing-banner").classList.remove("show");
            await loadQuotes();
            setTimeout(function() {
                var el = document.getElementById("search_input");
                if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
            }, 600);
        }
    } catch (err) {
        showMsg("Network error: " + err.message, "error");
        console.error("Save exception:", err);
    }

    btn.disabled = false;
    btn.innerText = "Save";
    isSaving = false;
}

async function loadQuotes() {
    var loadBtn = document.getElementById("btn-load");
    if (loadBtn) { loadBtn.disabled = true; loadBtn.innerText = "Loading..."; }
    document.getElementById("loading-indicator").style.display = "block";
    document.getElementById("quote_list").innerHTML = "";

    try {
        var res = await fetch(SUPABASE_URL + "/rest/v1/quotes?select=*&order=id.desc", {
            headers: {
                "apikey": SUPABASE_KEY,
                "Authorization": "Bearer " + SUPABASE_KEY,
                "Accept": "application/json"
            }
        });

        if (!res.ok) {
            var errText = await res.text();
            console.error("Load failed:", res.status, errText);
            document.getElementById("quote_list").innerHTML =
                '<p class="msg-error">Failed to load quotes (' + res.status + '). Tap Load to retry.</p>';
            document.getElementById("loading-indicator").style.display = "none";
            if (loadBtn) { loadBtn.disabled = false; loadBtn.innerText = "Load"; }
            return;
        }

        var data = await res.json();

        if (!Array.isArray(data)) {
            console.error("Unexpected response:", data);
            document.getElementById("quote_list").innerHTML =
                '<p class="msg-error">Unexpected data format. Tap Load to retry.</p>';
            document.getElementById("loading-indicator").style.display = "none";
            if (loadBtn) { loadBtn.disabled = false; loadBtn.innerText = "Load"; }
            return;
        }

        quotesCache = data;
        renderQuoteList(data);
    } catch (err) {
        console.error("loadQuotes error:", err);
        document.getElementById("quote_list").innerHTML =
            '<p class="msg-error">Network error. Check connection and tap Load.</p>';
    }

    document.getElementById("loading-indicator").style.display = "none";
    if (loadBtn) { loadBtn.disabled = false; loadBtn.innerText = "Load"; }
}

function mapStatusDisplay(s, pl) {
    // New status values
    if (s === "Profit") return { cls: "good", label: "Profit" };
    if (s === "Break-even") return { cls: "risk", label: "Break-even" };
    if (s === "Loss") return { cls: "bad", label: "Loss" };
    // Legacy Korean / English statuses — remap using profit_loss if available
    if (s === "Prepared" || s === "\uc9c4\ud589 \uac00\ub2a5") {
        if (pl != null) return pl > 0 ? { cls: "good", label: "Profit" } : pl === 0 ? { cls: "risk", label: "Break-even" } : { cls: "bad", label: "Loss" };
        return { cls: "good", label: "Profit" };
    }
    if (s === "Internal Review" || s === "\uc704\ud5d8") return { cls: "risk", label: "Break-even" };
    // Default fallback
    if (pl != null) return pl > 0 ? { cls: "good", label: "Profit" } : pl === 0 ? { cls: "risk", label: "Break-even" } : { cls: "bad", label: "Loss" };
    return { cls: "bad", label: "Loss" };
}

function editQuote(q) {
    editingId = q.id;

    document.getElementById("quote_number").value = q.quote_number || "";
    document.getElementById("issue_date").value = q.issue_date || "";
    document.getElementById("prepared_by").value = q.prepared_by || "";

    document.getElementById("company_name").value = q.company_name || "";
    document.getElementById("company_abn").value = q.company_abn || "";
    document.getElementById("company_address").value = q.company_address || "";
    document.getElementById("company_phone").value = q.company_phone || "";
    document.getElementById("company_email").value = q.company_email || "";

    document.getElementById("agency").value = q.agency || "";
    document.getElementById("contact_person").value = q.contact_person || "";
    document.getElementById("client_email").value = q.client_email || "";
    document.getElementById("client_phone").value = q.client_phone || "";

    document.getElementById("tour_name").value = q.tour_name || "";

async function deleteQuote(id) {
    if (!confirm("Delete this quote?")) return;

    showMsg("Deleting...", "info");

    try {
        var res = await fetch(SUPABASE_URL + "/rest/v1/quotes?id=eq." + id, {
            method: "DELETE",
            headers: {
                "apikey": SUPABASE_KEY,
                "Authorization": "Bearer " + SUPABASE_KEY
            }
        });

        if (!res.ok) {
            showMsg("Delete failed: " + res.status, "error");
            return;
        }

        showMsg("Deleted", "success");
        loadQuotes();
    } catch (err) {
        showMsg("Delete error: " + err.message, "error");
    }
}

function formatDate(dateStr) {
    if (!dateStr) return "";
    var date = new Date(dateStr + "T00:00:00");
    return date.toLocaleDateString("en-AU", { year: "numeric", month: "short", day: "numeric" });
}

// Export as JSON backup
function exportBackup() {
    if (quotesCache.length === 0) {
        showMsg("No data to export. Load quotes first.", "error");
        return;
    }
    var blob = new Blob([JSON.stringify(quotesCache, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "quotes_backup_" + new Date().toISOString().slice(0,10) + ".json";
    a.click();
    URL.revokeObjectURL(url);
    showMsg("Backup downloaded", "success");
}

function renderQuoteList(data) {
    var loadBtn = document.getElementById("btn-load");
    document.getElementById("loading-indicator").style.display = "none";
    if (loadBtn) { loadBtn.disabled = false; loadBtn.innerText = "Load"; }

    if (!data || data.length === 0) {
        document.getElementById("quote_list").innerHTML =
            '<p style="text-align:center; color:#888;">No quotes found.</p>';
        return;
    }

    var html = '<p style="color:#666; font-size:0.85em;">' + data.length + ' quotes</p>';

    data.forEach(function(q) {
        var idx = quotesCache.indexOf(q);
        var pl = (q.profit_loss != null) ? q.profit_loss : (q.margin != null ? q.margin : 0);
        var pr = (q.profit_rate != null) ? q.profit_rate : (q.margin_rate != null ? q.margin_rate : 0);
        var toi = (q.total_operating_income != null) ? q.total_operating_income : (q.total_revenue != null ? q.total_revenue : 0);
        var displayStatus = mapStatusDisplay(q.status, pl);
        var cls = displayStatus.cls;

        html +=
            '<div class="box ' + cls + '">' +
            '<h4>' + (q.tour_name || "Untitled") + '</h4>' +
            '<p>Agency: ' + (q.agency || "\u2014") + ' | Pax: ' + (q.pax || "\u2014") + '</p>' +
            '<p>Cost: $' + (q.total_cost || 0).toLocaleString() + ' \u2192 Income: $' + toi.toLocaleString() + '</p>' +
            '<p>P/L: <span class="' + cls + '">$' + pl.toLocaleString() + ' (' + pr.toFixed(1) + '%)</span> | ' + displayStatus.label + '</p>' +
            '<div class="quote-actions">' +
            '<button onclick="editQuoteByIndex(' + idx + ')">Edit</button>' +
            '<button onclick="deleteQuote(\'' + q.id + '\')" class="btn-danger">Delete</button>' +
            '<button onclick="printQuoteByIndex(' + idx + ')" class="btn-secondary">PDF</button>' +
            '</div></div>';
    });

    document.getElementById("quote_list").innerHTML = html;
}

function filterQuotes() {
    var keyword = (document.getElementById("search_input").value || "").toLowerCase().trim();
    if (!quotesCache || quotesCache.length === 0) return;
    if (!keyword) { renderQuoteList(quotesCache); return; }
    var filtered = quotesCache.filter(function(q) {
        return (q.tour_name || "").toLowerCase().includes(keyword) ||
               (q.agency || "").toLowerCase().includes(keyword) ||
               String(q.pax || "").includes(keyword);
    });
    renderQuoteList(filtered);
}

        '</div>' +
        '<input type="text" class="h-name" placeholder="Hotel Name" value="' + (data.hotel_name||"") + '" style="width:100%;margin:4px 0;">' +
        '<div style="display:flex;gap:8px;flex-wrap:wrap;">' +
        '<div style="flex:1;min-width:100px;"><label style="font-size:11px;color:#666;">Single Rate</label>' +
        '<input type="number" class="h-sr" placeholder="0" value="' + (data.single_rate||"") + '" oninput="recalcHotel()" style="width:100%;margin:4px 0;"></div>' +
        '<div style="flex:1;min-width:100px;"><label style="font-size:11px;color:#666;">Sgl Rooms</label>' +
        '<input type="number" class="h-srm" placeholder="0" value="' + (data.single_rooms||"") + '" oninput="recalcHotel()" style="width:100%;margin:4px 0;"></div>' +
        '<div style="flex:1;min-width:100px;"><label style="font-size:11px;color:#666;">Twin Rate</label>' +
        '<input type="number" class="h-tr" placeholder="0" value="' + (data.twin_rate||"") + '" oninput="recalcHotel()" style="width:100%;margin:4px 0;"></div>' +
        '<div style="flex:1;min-width:100px;"><label style="font-size:11px;color:#666;">Twin Rooms</label>' +
        '<input type="number" class="h-trm" placeholder="0" value="' + (data.twin_rooms||"") + '" oninput="recalcHotel()" style="width:100%;margin:4px 0;"></div>' +
        '<div style="flex:1;min-width:100px;"><label style="font-size:11px;color:#666;">Triple Rate</label>' +
        '<input type="number" class="h-tpr" placeholder="0" value="' + (data.triple_rate||"") + '" oninput="recalcHotel()" style="width:100%;margin:4px 0;"></div>' +
        '<div style="flex:1;min-width:100px;"><label style="font-size:11px;color:#666;">Triple Rooms</label>' +
        '<input type="number" class="h-tprm" placeholder="0" value="' + (data.triple_rooms||"") + '" oninput="recalcHotel()" style="width:100%;margin:4px 0;"></div>' +
        '</div>' +
        '<div style="display:flex;gap:8px;align-items:center;margin-top:4px;">' +
        '<input type="text" class="h-remark" placeholder="Remark" value="' + (data.remark||"") + '" style="flex:1;margin:0;">' +
        '<input type="number" class="h-total" placeholder="Total" readonly style="width:120px;margin:0;background:#e8f5e9;font-weight:600;">' +
        '<button type="button" onclick="this.closest(\'.hotel-row\').remove();recalcHotel();" class="btn-danger" style="flex:0;min-width:70px;padding:10px 12px;min-height:40px;">Remove</button>' +
        '</div>';
    document.getElementById("hotel_rows").appendChild(div);
    recalcHotel();
}

function recalcHotel() {
    var rows = document.querySelectorAll(".hotel-row");
    var subtotal = 0;
    rows.forEach(function(row) {
        var cin = row.querySelector(".h-cin").value;
        var cout = row.querySelector(".h-cout").value;
        var nights = 0;
        if (cin && cout) {
            var d1 = new Date(cin);
            var d2 = new Date(cout);
            nights = Math.max(0, Math.round((d2 - d1) / 86400000));
        }
        row.querySelector(".h-nights").value = nights || "";
        var sr  = parseFloat(row.querySelector(".h-sr").value)  || 0;
        var srm = parseFloat(row.querySelector(".h-srm").value) || 0;
        var tr  = parseFloat(row.querySelector(".h-tr").value)  || 0;
        var trm = parseFloat(row.querySelector(".h-trm").value) || 0;
        var tpr = parseFloat(row.querySelector(".h-tpr").value) || 0;
        var tprm= parseFloat(row.querySelector(".h-tprm").value)|| 0;
        var total = (sr * srm * nights) + (tr * trm * nights) + (tpr * tprm * nights);
        row.querySelector(".h-total").value = total > 0 ? total.toFixed(2) : "";
        subtotal += total;
    });
    document.getElementById("hotel_subtotal").innerText = "Subtotal: $" + subtotal.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
    document.getElementById("hotel_cost").value = subtotal > 0 ? subtotal : "";
    calculate();
}

function getHotelItems() {
    var items = [];
    document.querySelectorAll(".hotel-row").forEach(function(row) {
        items.push({
            check_in_date:  row.querySelector(".h-cin").value,
            check_out_date: row.querySelector(".h-cout").value,
            hotel_name:     row.querySelector(".h-name").value,
            single_rate:    parseFloat(row.querySelector(".h-sr").value)  || 0,
            single_rooms:   parseFloat(row.querySelector(".h-srm").value) || 0,
            twin_rate:      parseFloat(row.querySelector(".h-tr").value)  || 0,
            twin_rooms:     parseFloat(row.querySelector(".h-trm").value) || 0,
            triple_rate:    parseFloat(row.querySelector(".h-tpr").value) || 0,
            triple_rooms:   parseFloat(row.querySelector(".h-tprm").value)|| 0,
            nights:         parseFloat(row.querySelector(".h-nights").value)|| 0,
            remark:         row.querySelector(".h-remark").value
        });
    });
    return items;
}

function loadHotelItems(items) {
    document.getElementById("hotel_rows").innerHTML = "";
    if (!items || items.length === 0) { recalcHotel(); return; }
    items.forEach(function(item) { addHotelRow(item); });
    recalcHotel();
}
</script>
</body>
